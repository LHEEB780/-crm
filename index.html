<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM System</title>
    <meta name="description" content="An advanced, professional Bilingual CRM System (Arabic & English) with an elegant Dashboard, Client Management, Companies/Contracts CRM, Sales Pipeline (Leads, Invoices), Task Priority Management, Calendar view, RBAC roles, and beautiful Dark Blue & Orange theme." />
    <meta property="og:title" content="CRM System" />
    <meta property="og:description" content="An advanced, professional Bilingual CRM System (Arabic & English) with an elegant Dashboard, Client Management, Companies/Contracts CRM, Sales Pipeline (Leads, Invoices), Task Priority Management, Calendar view, RBAC roles, and beautiful Dark Blue & Orange theme." />
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Immediate theme restoration from localStorage -->
    <script>
      (function() {
        try {
          var p = localStorage.getItem('crm_theme_primary');
          var s = localStorage.getItem('crm_theme_secondary');
          if (p) document.documentElement.style.setProperty('--brand-primary', p);
          if (s) document.documentElement.style.setProperty('--brand-secondary', s);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
